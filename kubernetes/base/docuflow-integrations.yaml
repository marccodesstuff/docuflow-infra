apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuflow-integrations
  namespace: docuflow
  labels:
    app: docuflow-integrations
    app.kubernetes.io/name: docuflow-integrations
    app.kubernetes.io/part-of: docuflow-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: docuflow-integrations
  template:
    metadata:
      labels:
        app: docuflow-integrations
    spec:
      serviceAccountName: docuflow
      containers:
        - name: docuflow-integrations
          image: docuflow/docuflow-integrations:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: docuflow-config
            - secretRef:
                name: docuflow-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: docuflow-integrations
  namespace: docuflow
spec:
  selector:
    app: docuflow-integrations
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP