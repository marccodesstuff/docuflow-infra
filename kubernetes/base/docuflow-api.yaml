apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuflow-api
  namespace: docuflow
  labels:
    app: docuflow-api
    app.kubernetes.io/name: docuflow-api
    app.kubernetes.io/part-of: docuflow-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: docuflow-api
  template:
    metadata:
      labels:
        app: docuflow-api
    spec:
      serviceAccountName: docuflow
      containers:
        - name: docuflow-api
          image: docuflow/docuflow-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: docuflow-config
            - secretRef:
                name: docuflow-secrets
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: QUEUE_CONNECTION
              value: "redis"
            - name: CACHE_DRIVER
              value: "redis"
            - name: SESSION_DRIVER
              value: "redis"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: docuflow-api
  namespace: docuflow
spec:
  selector:
    app: docuflow-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP