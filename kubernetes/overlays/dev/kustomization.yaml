apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: docuflow

resources:
  - namespace.yaml
  - configmap-secret.yaml
  - docuflow-core.yaml
  - docuflow-integrations.yaml
  - docuflow-ml.yaml
  - docuflow-api.yaml
  - postgres.yaml
  - redis.yaml
  - minio.yaml
  - kafka-zookeeper.yaml

commonLabels:
  environment: dev

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: docuflow-core
      spec:
        replicas: 1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: docuflow-integrations
      spec:
        replicas: 1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: docuflow-api
      spec:
        replicas: 1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: docuflow-ml
      spec:
        replicas: 1